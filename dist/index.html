<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101419"><meta name="description" content="Little ideas. Playable worlds. Build, play and export your own 2D and 3D games with Soulcode, the friendly no-code game studio."><title>Soulcode — little ideas, playable worlds</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"></head><body>
<div id="app">
<header class="topbar"><a class="brand" href="./" aria-label="Soulcode studio"><img src="./favicon.svg" alt=""><span>soulcode<span class="brand-dot">.</span></span></a><span class="header-divider"></span><button id="project-menu" class="project-button" title="My projects"><span class="project-icon" data-icon="folder"></span><span id="project-label">Crystal Quest</span><span data-icon="down"></span></button><span class="save-state" id="save-state"><i></i> Saved on this device</span><div class="topbar-right"><button id="help-button" class="icon-button" aria-label="How to make a game" title="How to make a game" data-icon="help"></button><button id="export-button" class="button export-button"><span data-icon="upload"></span>Export game<span data-icon="chevron"></span></button><span class="avatar" title="Your little studio">S</span></div></header>
<div class="studio">
<nav class="tool-rail" aria-label="Studio tools"><div class="rail-top"><button class="rail-button active" data-panel="assets" title="Assets"><span data-icon="box"></span><span>Assets</span></button><button class="rail-button" data-panel="behaviors" title="Behaviors"><span data-icon="bolt"></span><span>Behaviors</span></button><button class="rail-button" data-panel="sounds" title="Sounds"><span data-icon="music"></span><span>Sounds</span></button><button class="rail-button" data-panel="world" title="World settings"><span data-icon="world"></span><span>World</span></button><div class="rail-line"></div><button class="rail-button" id="templates-button" title="Starter games"><span data-icon="gamepad"></span><span>Starters</span></button></div><button class="rail-button" id="projects-button"><span data-icon="folder"></span><span>Projects</span></button><div class="rail-spark" data-icon="sparkles"></div></nav>
<aside class="library" id="library" aria-label="Asset library"></aside>
<main class="center">
<div class="canvas-toolbar"><div class="world-title"><span class="live-dot"></span><span id="scene-heading">The little forest</span><span class="world-badge">WORLD</span></div><div class="mode-switch" aria-label="View mode"><button data-mode="2d">2D</button><button data-mode="3d" class="active">3D</button></div><div class="preview-controls"><button id="stop-button" class="icon-button" title="Stop preview" aria-label="Stop preview" hidden data-icon="stop"></button><button id="pause-button" class="icon-button" title="Pause preview" aria-label="Pause preview" hidden data-icon="pause"></button><button id="play-button" class="button play-button"><span data-icon="play"></span><span>Play</span><kbd>↵</kbd></button></div></div>
<div class="stage" id="stage"><div class="stage-meta" id="stage-meta"><span class="tiny-label">YOUR WORLD, YOUR RULES</span><span class="scene-coordinate">X <b id="pos-x">−2.8</b><span>Y</span><b id="pos-z">2.2</b></span></div><div id="viewport" tabindex="0" role="application" aria-label="Game editor. Drag objects to move them. Drop assets to add them."></div><div class="canvas-tools" id="canvas-tools"><button class="icon-button active" data-tool="select" title="Select and move · V" aria-label="Select and move" data-icon="mouse"></button><button class="icon-button" data-tool="orbit" title="Look around · H" aria-label="Look around" data-icon="hand"></button><span></span><button id="grid-button" class="icon-button" title="Toggle grid" aria-label="Toggle grid" aria-pressed="false" data-icon="grid"></button><button id="focus-button" class="icon-button" title="Focus canvas" aria-label="Focus canvas" data-icon="expand"></button></div><div class="scene-label" id="scene-label"><span class="label-line"></span><span>little world.<br><strong>big possibilities.</strong></span><span class="label-star">✳</span></div><div class="stage-bottom" id="stage-bottom"><div class="history-controls"><button id="undo-button" class="icon-button" title="Undo · Ctrl Z" aria-label="Undo" data-icon="undo"></button><button id="redo-button" class="icon-button" title="Redo · Ctrl Shift Z" aria-label="Redo" data-icon="redo"></button></div><span class="canvas-hint" id="canvas-hint"><span data-icon="mouse"></span>Drag to move <b>·</b> Right-drag to look around</span><div class="zoom-controls"><button id="zoom-out" class="icon-button" aria-label="Zoom out" data-icon="minus"></button><button id="zoom-reset">100<span>%</span></button><button id="zoom-in" class="icon-button" aria-label="Zoom in" data-icon="plus"></button></div></div><button id="path-done" class="button path-done" hidden><span data-icon="check"></span>Done drawing</button></div>
<section class="scenes-panel" aria-label="Scenes"><div class="scenes-header"><span><span data-icon="layers"></span>Scenes <span id="scene-count" class="count">2</span></span><button id="scene-settings" class="quiet-button"><span data-icon="settings"></span>Scene settings</button></div><div id="scene-strip" class="scene-strip"></div></section>
</main>
<aside class="inspector" id="inspector" aria-label="Selected object settings"></aside>
</div>
<footer class="statusbar"><span><i></i><span id="status-text">A little studio for big imaginations</span></span><span id="object-count">23 objects</span><span class="footer-tip"><span data-icon="sparkles"></span>No code. Just possibility.</span><button id="sound-toggle" aria-label="Toggle sound" title="Sound on"><span data-icon="volume"></span><span>Sound on</span></button></footer>
</div>
<dialog id="modal"><div class="modal-top"><span id="modal-eyebrow" class="tiny-label">MAKE SOMETHING YOU LOVE</span><button id="modal-close" class="icon-button" aria-label="Close dialog" data-icon="close"></button></div><div id="modal-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><input id="asset-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,audio/*" multiple hidden><input id="project-input" type="file" accept=".soulcode,.json,application/json" hidden><noscript>Soulcode needs JavaScript to bring your games to life.</noscript><script type="module" src="./app.js"></script>
</body></html>
